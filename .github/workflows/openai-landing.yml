name: OpenAI Landing Generator

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Описание лендинга"
        required: true
        default: "Тестовый запуск"
        type: string
      page:
        description: "Тип страницы (main|investment|gosuslugi|influence)"
        required: false
        default: "main"
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: copilot/landing-autogen
      SPEC: ${{ inputs.spec }}
      PAGE_INPUT: ${{ inputs.page }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_PUSH_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Update spec.json
        run: |
          mkdir -p specs
          echo "{\"description\": \"${SPEC}\"}" > specs/landing-spec.json

      - name: Generate landing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p landing
          echo "<html><body><h1>Generated OK</h1></body></html>" > landing/index.html
          echo "test" > landing/BUILD_LOG.md

      - name: Show inputs
        run: |
          echo "Page: ${{ inputs.page }}" >> $GITHUB_STEP_SUMMARY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git switch -c "$BRANCH_NAME" || git switch "$BRANCH_NAME"

          git add specs/ landing/
          git commit -m "autogen (page: ${{ inputs.page }})" || echo "No changes"
          git push origin "$BRANCH_NAME"

      - name: Summary
        run: echo "Done" >> $GITHUB_STEP_SUMMARY
