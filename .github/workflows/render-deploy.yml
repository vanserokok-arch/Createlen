name: Render Deploy

on:
  workflow_dispatch:
    inputs:
      service_id:
        description: "Render Service ID (optional, uses secret if not provided)"
        required: false
        type: string
  push:
    branches:
      - copilot/landing-autogen

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_PUSH_TOKEN || github.token }}
          fetch-depth: 0

      - name: Check if landing files exist
        id: check_files
        run: |
          if [ -d "landing" ] && [ -f "landing/index.html" ]; then
            echo "landing_exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ Landing files found"
          else
            echo "landing_exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Landing files not found, skipping deploy"
          fi

      - name: Trigger Render Deploy
        if: steps.check_files.outputs.landing_exists == 'true'
        id: render_deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ inputs.service_id || secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "❌ RENDER_API_KEY not set in secrets"
            echo "deploy_status=skipped" >> "$GITHUB_OUTPUT"
            echo "deploy_message=RENDER_API_KEY not configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$RENDER_SERVICE_ID" ]; then
            echo "❌ RENDER_SERVICE_ID not set"
            echo "deploy_status=skipped" >> "$GITHUB_OUTPUT"
            echo "deploy_message=RENDER_SERVICE_ID not configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "🚀 Triggering Render deploy for service: $RENDER_SERVICE_ID"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
            DEPLOY_ID=$(echo "$BODY" | jq -r '.id // "unknown"')
            echo "✅ Deploy triggered successfully"
            echo "Deploy ID: $DEPLOY_ID"
            echo "deploy_status=success" >> "$GITHUB_OUTPUT"
            echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
            echo "deploy_message=Deploy triggered successfully (ID: $DEPLOY_ID)" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Deploy failed with status $HTTP_CODE"
            echo "deploy_status=failed" >> "$GITHUB_OUTPUT"
            echo "deploy_message=Deploy failed with HTTP $HTTP_CODE" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Deploy Log
        if: steps.check_files.outputs.landing_exists == 'true'
        run: |
          mkdir -p landing

          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          cat > landing/DEPLOY_LOG.md <<EOF
# Render Deploy Log

**Timestamp:** $TIMESTAMP
**Branch:** ${{ github.ref_name }}
**Commit:** ${{ github.sha }}
**Triggered by:** ${{ github.event_name }}

## Deploy Status

- **Status:** ${{ steps.render_deploy.outputs.deploy_status || 'skipped' }}
- **Message:** ${{ steps.render_deploy.outputs.deploy_message || 'No deployment attempted' }}
- **Deploy ID:** ${{ steps.render_deploy.outputs.deploy_id || 'N/A' }}

## Configuration

- **Service ID:** ${{ inputs.service_id || secrets.RENDER_SERVICE_ID || 'Not configured' }}
- **API Key:** ${{ secrets.RENDER_API_KEY && '✅ Configured' || '❌ Not configured' }}

## Files Deployed
EOF

          if [ -d "landing" ]; then
            echo "" >> landing/DEPLOY_LOG.md
            echo "Landing files:" >> landing/DEPLOY_LOG.md
            ls -lh landing/ | grep -v "DEPLOY_LOG" >> landing/DEPLOY_LOG.md || true
          fi

          echo "" >> landing/DEPLOY_LOG.md
          echo "---" >> landing/DEPLOY_LOG.md
          echo "" >> landing/DEPLOY_LOG.md
          echo "To check deploy status, visit: https://dashboard.render.com" >> landing/DEPLOY_LOG.md

      - name: Commit Deploy Log
        if: steps.check_files.outputs.landing_exists == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add landing/DEPLOY_LOG.md

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(deploy): add Render deploy log

Deploy Status: ${{ steps.render_deploy.outputs.deploy_status || 'skipped' }}
Deploy ID: ${{ steps.render_deploy.outputs.deploy_id || 'N/A' }}

Triggered by: ${{ github.event_name }}
Commit: ${{ github.sha }}"

            git push origin "${GITHUB_REF_NAME}"
            echo "✅ Deploy log committed and pushed"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## 🚀 Render Deploy Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.check_files.outputs.landing_exists }}" = "true" ]; then
            echo "✅ Landing files found" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Status:** ${{ steps.render_deploy.outputs.deploy_status || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
            echo "**Message:** ${{ steps.render_deploy.outputs.deploy_message || 'No deployment attempted' }}" >> "$GITHUB_STEP_SUMMARY"

            if [ -n "${{ steps.render_deploy.outputs.deploy_id }}" ]; then
              echo "**Deploy ID:** \`${{ steps.render_deploy.outputs.deploy_id }}\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "⚠️ No landing files to deploy" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Configuration" >> "$GITHUB_STEP_SUMMARY"
          echo "- RENDER_API_KEY: ${{ secrets.RENDER_API_KEY && '✅ Set' || '❌ Not set' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID && '✅ Set' || '❌ Not set' }}" >> "$GITHUB_STEP_SUMMARY"
