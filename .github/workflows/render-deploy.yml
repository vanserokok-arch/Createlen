name: Render Deploy

on:
  workflow_dispatch:
    inputs:
      service_id:
        description: "Render Service ID (optional, uses secret if not provided)"
        required: false
        type: string
  push:
    branches:
      - copilot/landing-autogen

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.REPO_PUSH_TOKEN }}

      - name: Check if landing files exist
        id: check_files
        run: |
          if [ -d "landing" ] && [ -f "landing/index.html" ]; then
            echo "landing_exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ Landing files found"
          else
            echo "landing_exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Landing files not found, skipping deploy"
          fi

      - name: Trigger Render Deploy
        id: render_deploy
        if: steps.check_files.outputs.landing_exists == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEFAULT_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "❌ RENDER_API_KEY not set in secrets"
            echo "deploy_status=skipped" >> "$GITHUB_OUTPUT"
            echo "deploy_message=RENDER_API_KEY not configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Выбираем service id: input → секрет
          SERVICE_ID="${{ inputs.service_id }}"
          if [ -z "$SERVICE_ID" ]; then
            SERVICE_ID="$DEFAULT_SERVICE_ID"
          fi

          if [ -z "$SERVICE_ID" ]; then
            echo "❌ SERVICE_ID not set (no input and no RENDER_SERVICE_ID secret)"
            echo "deploy_status=skipped" >> "$GITHUB_OUTPUT"
            echo "deploy_message=SERVICE_ID not configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "🚀 Triggering Render deploy for service: $SERVICE_ID"

          # Убедимся, что jq есть
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

          RESPONSE="$(curl -s -w '\n%{http_code}' -X POST \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}')"

          HTTP_CODE="$(echo "$RESPONSE" | tail -n1)"
          BODY="$(echo "$RESPONSE" | sed '$d')"

          echo "HTTP Status: $HTTP_CODE"
          echo "Response body:"
          echo "$BODY"

          if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
            DEPLOY_ID="$(echo "$BODY" | jq -r '.id // "unknown")"
            echo "✅ Deploy triggered successfully (ID: $DEPLOY_ID)"
            echo "deploy_status=success" >> "$GITHUB_OUTPUT"
            echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
            echo "deploy_message=Deploy triggered successfully (ID: $DEPLOY_ID)" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Deploy failed with status $HTTP_CODE"
            echo "deploy_status=failed" >> "$GITHUB_OUTPUT"
            echo "deploy_message=Deploy failed with HTTP $HTTP_CODE" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Deploy Log
        if: steps.check_files.outputs.landing_exists == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          TRIGGERED_BY: ${{ github.event_name }}
          INPUT_SERVICE_ID: ${{ inputs.service_id }}
          SECRET_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY_SET: ${{ secrets.RENDER_API_KEY != '' }}
          DEPLOY_STATUS: ${{ steps.render_deploy.outputs.deploy_status || 'skipped' }}
          DEPLOY_MESSAGE: ${{ steps.render_deploy.outputs.deploy_message || 'No deployment attempted' }}
          DEPLOY_ID: ${{ steps.render_deploy.outputs.deploy_id || 'N/A' }}
        run: |
          mkdir -p landing

          # Итоговый service id для лога
          SERVICE_ID="$INPUT_SERVICE_ID"
          if [ -z "$SERVICE_ID" ]; then
            SERVICE_ID="$SECRET_SERVICE_ID"
          fi
          if [ -z "$SERVICE_ID" ]; then
            SERVICE_ID="Not configured"
          fi

          TIMESTAMP="$(date -u +"%Y-%m-%d %H:%M:%S UTC")"

          cat > landing/DEPLOY_LOG.md <<EOF
# Render Deploy Log

**Timestamp:** $TIMESTAMP  
**Branch:** $BRANCH  
**Commit:** $COMMIT  
**Triggered by:** $TRIGGERED_BY  

## Deploy Status

- **Status:** $DEPLOY_STATUS  
- **Message:** $DEPLOY_MESSAGE  
- **Deploy ID:** $DEPLOY_ID  

## Configuration

- **Service ID:** $SERVICE_ID  
- **API Key:** $(if [ "$RENDER_API_KEY_SET" = "true" ]; then echo '✅ Configured'; else echo '❌ Not configured'; fi)

## Files Deployed
EOF

          if [ -d "landing" ]; then
            echo "" >> landing/DEPLOY_LOG.md
            echo "Landing files:" >> landing/DEPLOY_LOG.md
            ls -lh landing/ | grep -v "DEPLOY_LOG.md" >> landing/DEPLOY_LOG.md || true
          fi

          echo "" >> landing/DEPLOY_LOG.md
          echo "---" >> landing/DEPLOY_LOG.md
          echo "" >> landing/DEPLOY_LOG.md
          echo "To check deploy status, visit: https://dashboard.render.com" >> landing/DEPLOY_LOG.md

      - name: Commit Deploy Log
        if: steps.check_files.outputs.landing_exists == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add landing/DEPLOY_LOG.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(deploy): update Render deploy log"
          git push origin "HEAD:${GITHUB_REF_NAME:-${GITHUB_REF#refs/heads/}}"
          echo "✅ Deploy log committed and pushed"

      - name: Summary
        if: always()
        env:
          LANDING_EXISTS: ${{ steps.check_files.outputs.landing_exists }}
          DEPLOY_STATUS: ${{ steps.render_deploy.outputs.deploy_status || 'skipped' }}
          DEPLOY_MESSAGE: ${{ steps.render_deploy.outputs.deploy_message || 'No deployment attempted' }}
          DEPLOY_ID: ${{ steps.render_deploy.outputs.deploy_id || '' }}
          RENDER_API_KEY_SET: ${{ secrets.RENDER_API_KEY != '' }}
          RENDER_SERVICE_ID_SET: ${{ secrets.RENDER_SERVICE_ID != '' }}
        run: |
          echo "## 🚀 Render Deploy Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$LANDING_EXISTS" = "true" ]; then
            echo "✅ Landing files found" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Status:** $DEPLOY_STATUS" >> "$GITHUB_STEP_SUMMARY"
            echo "**Message:** $DEPLOY_MESSAGE" >> "$GITHUB_STEP_SUMMARY"

            if [ -n "$DEPLOY_ID" ]; then
              echo "**Deploy ID:** \`$DEPLOY_ID\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "⚠️ No landing files to deploy" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Configuration" >> "$GITHUB_STEP_SUMMARY"
          if [ "$RENDER_API_KEY_SET" = "true" ]; then
            echo "- RENDER_API_KEY: ✅ Set" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- RENDER_API_KEY: ❌ Not set" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$RENDER_SERVICE_ID_SET" = "true" ]; then
            echo "- RENDER_SERVICE_ID: ✅ Set" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- RENDER_SERVICE_ID: ❌ Not set" >> "$GITHUB_STEP_SUMMARY"
          fi
