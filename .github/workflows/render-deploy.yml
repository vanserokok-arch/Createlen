name: Render Deploy

on:
  workflow_dispatch:
    inputs:
      service_id:
        description: 'Render Service ID (optional, uses secret if not provided)'
        required: false
        type: string
  push:
    branches:
      - copilot/landing-autogen

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if landing files exist
        id: check_files
        run: |
          if [ -d "landing" ] && [ -f "landing/index.html" ]; then
            echo "landing_exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ Landing files found"
          else
            echo "landing_exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Landing files not found, skipping deploy"
          fi

      - name: Trigger Render Deploy
        if: steps.check_files.outputs.landing_exists == 'true'
        id: render_deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_INPUT: ${{ inputs.service_id }}
          RENDER_SERVICE_ID_SECRET: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "❌ RENDER_API_KEY not set in secrets"
            echo "deploy_status=skipped" >> "$GITHUB_OUTPUT"
            echo "deploy_message=RENDER_API_KEY not configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SERVICE_ID="$RENDER_SERVICE_ID_INPUT"
          if [ -z "$SERVICE_ID" ]; then
            SERVICE_ID="$RENDER_SERVICE_ID_SECRET"
          fi

          if [ -z "$SERVICE_ID" ]; then
            echo "❌ RENDER_SERVICE_ID not set"
            echo "deploy_status=skipped" >> "$GITHUB_OUTPUT"
            echo "deploy_message=RENDER_SERVICE_ID not configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "service_id=$SERVICE_ID" >> "$GITHUB_OUTPUT"

          echo "🚀 Triggering Render deploy for service: $SERVICE_ID"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
            DEPLOY_ID=$(echo "$BODY" | jq -r '.id // "unknown"')
            echo "✅ Deploy triggered successfully"
            echo "Deploy ID: $DEPLOY_ID"
            echo "deploy_status=success" >> "$GITHUB_OUTPUT"
            echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
            echo "deploy_message=Deploy triggered successfully (ID: $DEPLOY_ID)" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Deploy failed with status $HTTP_CODE"
            echo "deploy_status=failed" >> "$GITHUB_OUTPUT"
            echo "deploy_message=Deploy failed with HTTP $HTTP_CODE" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Deploy Log
        if: steps.check_files.outputs.landing_exists == 'true'
        run: |
          mkdir -p landing

          cat > landing/DEPLOY_LOG.md << 'EOF'
# Render Deploy Log

**Timestamp:** PLACEHOLDER_TIMESTAMP
**Branch:** PLACEHOLDER_BRANCH
**Commit:** PLACEHOLDER_COMMIT
**Triggered by:** PLACEHOLDER_EVENT

## Deploy Status

- **Status:** PLACEHOLDER_STATUS
- **Message:** PLACEHOLDER_MESSAGE
- **Deploy ID:** PLACEHOLDER_DEPLOY_ID

## Configuration

- **Service ID:** PLACEHOLDER_SERVICE_ID
- **API Key:** PLACEHOLDER_API_KEY_STATUS

## Files Deployed

EOF

          # Подставляем реальные значения (чтобы не ломать YAML/expressions)
          ts="$(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          sed -i.bak "s/PLACEHOLDER_TIMESTAMP/$ts/" landing/DEPLOY_LOG.md
          sed -i.bak "s/PLACEHOLDER_BRANCH/${GITHUB_REF_NAME}/" landing/DEPLOY_LOG.md
          sed -i.bak "s/PLACEHOLDER_COMMIT/${GITHUB_SHA}/" landing/DEPLOY_LOG.md
          sed -i.bak "s/PLACEHOLDER_EVENT/${GITHUB_EVENT_NAME}/" landing/DEPLOY_LOG.md

          status="${{ steps.render_deploy.outputs.deploy_status }}"
          [ -z "$status" ] && status="skipped"
          msg="${{ steps.render_deploy.outputs.deploy_message }}"
          [ -z "$msg" ] && msg="No deployment attempted"
          id="${{ steps.render_deploy.outputs.deploy_id }}"
          [ -z "$id" ] && id="N/A"
          svc="${{ steps.render_deploy.outputs.service_id }}"
          [ -z "$svc" ] && svc="Not configured"

          api_status="❌ Not configured"
          if [ -n "${{ secrets.RENDER_API_KEY }}" ]; then
            api_status="✅ Configured"
          fi

          sed -i.bak "s/PLACEHOLDER_STATUS/$status/" landing/DEPLOY_LOG.md
          sed -i.bak "s/PLACEHOLDER_MESSAGE/$msg/" landing/DEPLOY_LOG.md
          sed -i.bak "s/PLACEHOLDER_DEPLOY_ID/$id/" landing/DEPLOY_LOG.md
          sed -i.bak "s/PLACEHOLDER_SERVICE_ID/$svc/" landing/DEPLOY_LOG.md
          sed -i.bak "s/PLACEHOLDER_API_KEY_STATUS/$api_status/" landing/DEPLOY_LOG.md
          rm -f landing/DEPLOY_LOG.md.bak

          if [ -d "landing" ]; then
            {
              echo ""
              echo "Landing files:"
              ls -lh landing/ | grep -v "DEPLOY_LOG" || true
              echo ""
              echo "---"
              echo ""
              echo "To check deploy status, visit: https://dashboard.render.com"
            } >> landing/DEPLOY_LOG.md
          fi

      - name: Commit Deploy Log
        if: steps.check_files.outputs.landing_exists == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add landing/DEPLOY_LOG.md

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(deploy): add Render deploy log"
            git push origin "${GITHUB_REF_NAME}"
            echo "✅ Deploy log committed and pushed"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## 🚀 Render Deploy Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.check_files.outputs.landing_exists }}" = "true" ]; then
            echo "✅ Landing files found" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Status:** ${{ steps.render_deploy.outputs.deploy_status }}" >> "$GITHUB_STEP_SUMMARY"
            echo "**Message:** ${{ steps.render_deploy.outputs.deploy_message }}" >> "$GITHUB_STEP_SUMMARY"

            if [ -n "${{ steps.render_deploy.outputs.deploy_id }}" ]; then
              echo "**Deploy ID:** \`${{ steps.render_deploy.outputs.deploy_id }}\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "⚠️ No landing files to deploy" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Configuration" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ secrets.RENDER_API_KEY }}" ]; then
            echo "- RENDER_API_KEY: ✅ Set" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- RENDER_API_KEY: ❌ Not set" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "${{ secrets.RENDER_SERVICE_ID }}" ]; then
            echo "- RENDER_SERVICE_ID: ✅ Set" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- RENDER_SERVICE_ID: ❌ Not set" >> "$GITHUB_STEP_SUMMARY"
          fi
